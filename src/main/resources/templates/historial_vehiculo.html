<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Historial de Órdenes - Sistema Taller</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Historial de Órdenes del Vehículo</h1>
            <a th:href="@{/vehiculos}" class="btn btn-secondary">Volver a Vehículos</a>
        </div>

        <div class="card mb-4 shadow-sm" th:if="${vehiculo != null}">
            <div class="card-header bg-primary text-white">Detalles del Vehículo</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3"><strong>Placa:</strong> <span th:text="${vehiculo.noPlaca}"></span></div>
                    <div class="col-md-3"><strong>Marca:</strong> <span th:text="${vehiculo.marca}"></span></div>
                    <div class="col-md-3"><strong>Modelo:</strong> <span th:text="${vehiculo.modelo}"></span></div>
                    <div class="col-md-3"><strong>Color:</strong> <span th:text="${vehiculo.color}"></span></div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-info text-dark">Órdenes Registradas</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID Orden</th>
                                <th>Estado</th>
                                <th>Fecha Entrada</th>
                                <th>Costo Total</th>
                                <th>ID Mecánico</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(historialOrdenes)}">
                                <td colspan="5" class="text-center text-muted">Este vehículo no registra órdenes de servicio todavía.</td>
                            </tr>
                            <tr th:each="o : ${historialOrdenes}">
                                <td th:text="${o.idOrden}"></td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${o.estadoOrden}"></span>
                                </td>
                                <td th:text="${o.fechaEntrada}"></td>
                                <td th:text="${o.costoTotal}"></td>
                                <td th:text="${o.idMecanico}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
