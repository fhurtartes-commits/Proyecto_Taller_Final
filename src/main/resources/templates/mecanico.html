<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Gestión de Mecánicos - Sistema Taller</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="container py-4">

        <h1 class="mb-4">Gestión de Mecánicos del Taller</h1>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <div th:if="${exito}" class="alert alert-success" role="alert" th:text="${exito}"></div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Registrar Nuevo Mecánico</div>
            <div class="card-body">
                <form th:action="@{/mecanicos/guardar}" method="post" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" required maxlength="45" placeholder="Ej. Carlos López">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Especialidad</label>
                        <input type="text" name="especialidad" class="form-control" required maxlength="45" placeholder="Ej. Motor y Transmisión">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Teléfono</label>
                        <input type="text" name="telefono" class="form-control" maxlength="45" placeholder="Ej. 5555-4321">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Registrar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Modificar Mecánico</div>
            <div class="card-body">
                <p class="text-muted small mb-3">Usa el botón "Editar" de la tabla para cargar los datos aquí, o escribe el ID manualmente.</p>
                <form th:action="@{/mecanicos/actualizar}" method="post" class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">ID Mecánico</label>
                        <input type="number" id="modIdMecanico" name="idMecanico" class="form-control" required min="1">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="modNombre" name="nombre" class="form-control" required maxlength="45">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Especialidad</label>
                        <input type="text" id="modEspecialidad" name="especialidad" class="form-control" required maxlength="45">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="modTelefono" name="telefono" class="form-control" maxlength="45">
                    </div>
                    <div class="col-12 d-flex justify-content-end">
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-warning w-100">Modificar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Listado de Mecánicos Registrados</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Especialidad</th>
                                <th>Teléfono</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(mecanicos)}">
                                <td colspan="5" class="text-center text-muted">No hay mecánicos para mostrar.</td>
                            </tr>
                            <tr th:each="m : ${mecanicos}">
                                <td th:text="${m.idMecanico}"></td>
                                <td th:text="${m.nombre}"></td>
                                <td th:text="${m.especialidad}"></td>
                                <td th:text="${m.telefono}"></td>
                                <td class="text-end">
                                    <a th:href="@{/mecanicos/ordenes/{id}(id=${m.idMecanico})}" class="btn btn-sm btn-outline-info">Órdenes</a>
                                    
                                    <button type="button" class="btn btn-sm btn-outline-warning"
                                            th:attr="data-id=${m.idMecanico},data-nombre=${m.nombre},data-especialidad=${m.especialidad},data-telefono=${m.telefono}"
                                            onclick="cargarParaEditar(this)">Editar</button>
                                    
                                    <a th:href="@{/mecanicos/eliminar/{id}(id=${m.idMecanico})}" class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('¿Está seguro de eliminar a este mecánico?');">Eliminar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <script>
            function cargarParaEditar(btn) {
                document.getElementById('modIdMecanico').value = btn.dataset.id;
                document.getElementById('modNombre').value = btn.dataset.nombre || '';
                document.getElementById('modEspecialidad').value = btn.dataset.especialidad || '';
                document.getElementById('modTelefono').value = btn.dataset.telefono || '';
                document.getElementById('modNombre').focus();
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
