<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Gestión de Clientes - Sistema Taller</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="container py-4">
 
        <h1 class="mb-4">Gestión de Clientes del Taller</h1>
 
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>
 
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Registrar Nuevo Cliente</div>
            <div class="card-body">
                <form th:action="@{/clientes/crear}" method="post" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" required maxlength="45" placeholder="Ej. Juan Pérez">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">NIT</label>
                        <input type="text" name="nit" class="form-control" required maxlength="45" placeholder="Ej. 1234567-8">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" name="telefono" class="form-control" maxlength="45" placeholder="Ej. 5555-1234">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Registrar</button>
                    </div>
                </form>
            </div>
        </div>
 
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Modificar Cliente</div>
            <div class="card-body">
                <p class="text-muted small mb-3">Usa el botón "Editar" de la tabla para cargar los datos aquí, o escribe el ID manualmente.</p>
                <form th:action="@{/clientes/modificar}" method="post" class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">ID Cliente</label>
                        <input type="number" id="modIdCliente" name="idCliente" class="form-control" required min="1">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="modNombre" name="nombre" class="form-control" required maxlength="45">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">NIT</label>
                        <input type="text" id="modNit" name="nit" class="form-control" required maxlength="45">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="modTelefono" name="telefono" class="form-control" maxlength="45">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-warning w-100">Modificar</button>
                    </div>
                </form>
            </div>
        </div>
 
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Consultar Clientes</div>
            <div class="card-body">
                <form th:action="@{/clientes}" method="get" class="row g-3 mb-3">
                    <div class="col-md-7">
                        <label class="form-label">Buscar por NIT</label>
                        <input type="text" name="nit" class="form-control" th:value="${nitBuscado}" placeholder="Ej. 1234567-8">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-info w-100">Buscar</button>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <a th:href="@{/clientes}" class="btn btn-outline-secondary w-100">Ver todos</a>
                    </div>
                </form>
 
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>NIT</th>
                                <th>Teléfono</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(clientes)}">
                                <td colspan="5" class="text-center text-muted">No hay clientes para mostrar.</td>
                            </tr>
                            <tr th:each="c : ${clientes}">
                                <td th:text="${c.idCliente}"></td>
                                <td th:text="${c.nombre}"></td>
                                <td th:text="${c.nit}"></td>
                                <td th:text="${c.telefono}"></td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-sm btn-outline-warning"
                                            th:attr="data-id=${c.idCliente},data-nombre=${c.nombre},data-nit=${c.nit},data-telefono=${c.telefono}"
                                            onclick="cargarParaEditar(this)">Editar</button>
                                    <form th:action="@{/clientes/eliminar/{id}(id=${c.idCliente})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Eliminar a este cliente? Esta acción no se puede deshacer.');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
 
        <script>
            function cargarParaEditar(btn) {
                document.getElementById('modIdCliente').value = btn.dataset.id;
                document.getElementById('modNombre').value = btn.dataset.nombre || '';
                document.getElementById('modNit').value = btn.dataset.nit || '';
                document.getElementById('modTelefono').value = btn.dataset.telefono || '';
                document.getElementById('modNombre').focus();
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
