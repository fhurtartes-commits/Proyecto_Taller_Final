<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Gestión de Órdenes - Sistema Taller</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="container py-4">
        
        <h1 class="mb-4">Gestión de Órdenes del Taller</h1>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Crear Nueva Orden</div>
            <div class="card-body">
                <form th:action="@{/ordenes/crear}" method="post" class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label">No. Placa</label>
                        <input type="text" name="noPlaca" class="form-control" required placeholder="Ej. P-123XYZ">
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">ID Mecánico</label>
                        <input type="number" name="idMecanico" class="form-control" required placeholder="Ej. 1">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Crear Orden</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Registrar Servicio a Orden</div>
            <div class="card-body">
                <form th:action="@{/ordenes/registrar-servicio}" method="post" class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label">ID Orden</label>
                        <input type="number" name="idOrden" class="form-control" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">ID Servicio</label>
                        <input type="number" name="idServicio" class="form-control" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Asignar Servicio</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Asignar Repuesto (Bodega)</div>
            <div class="card-body">
                <form th:action="@{/ordenes/asignar-repuesto}" method="post" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">ID Orden</label>
                        <input type="number" name="idOrden" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">ID Bodega / Repuesto</label>
                        <input type="number" name="idBodega" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Cantidad</label>
                        <input type="number" name="cantidad" class="form-control" required value="1">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Asignar Repuesto</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Retirar Repuesto (Devolver a Bodega)</div>
            <div class="card-body">
                <form id="formRetirarRepuesto" onsubmit="this.action='/ordenes/retirar-repuesto/' + document.getElementById('idDetalleInput').value;" method="post" class="row g-3">
                    <div class="col-md-10">
                        <label class="form-label">ID Detalle de Repuesto</label>
                        <input type="number" id="idDetalleInput" class="form-control" required placeholder="Ej. 1">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-danger w-100">Retirar Repuesto</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row">

            <div class="col-md-4">
                <div class="card mb-4 shadow-sm">
                    <div class="card-header bg-primary text-white">Iniciar Reparación</div>
                    <div class="card-body">
                        <form id="formIniciar" onsubmit="this.action='/ordenes/iniciar/' + document.getElementById('idIniciarInput').value;" method="post" class="row g-3">
                            <div class="col-12">
                                <label class="form-label">ID Orden</label>
                                <input type="number" id="idIniciarInput" class="form-control" required placeholder="Ej. 1">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-outline-primary w-100">Iniciar Orden</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card mb-4 shadow-sm">
                    <div class="card-header bg-primary text-white">Finalizar Orden</div>
                    <div class="card-body">
                        <form id="formFinalizar" onsubmit="this.action='/ordenes/finalizar/' + document.getElementById('idFinalizarInput').value;" method="post" class="row g-3">
                            <div class="col-12">
                                <label class="form-label">ID Orden</label>
                                <input type="number" id="idFinalizarInput" class="form-control" required placeholder="Ej. 1">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-outline-success w-100">Finalizar Orden</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card mb-4 shadow-sm">
                    <div class="card-header bg-primary text-white">Cancelar Orden</div>
                    <div class="card-body">
                        <form id="formCancelar" onsubmit="this.action='/ordenes/cancelar/' + document.getElementById('idCancelarInput').value;" method="post" class="row g-3">
                            <div class="col-12">
                                <label class="form-label">ID Orden</label>
                                <input type="number" id="idCancelarInput" class="form-control" required placeholder="Ej. 1">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-outline-danger w-100">Cancelar Orden</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
